# Dual-arm Switch recording with four FlexiTac sensors; control matches collect_switch_bi.yaml.
# Keyboard: c=start, s=save, backspace=discard current episode, esc=exit.
# Tactile zero updates automatically after an observed release and a stable pressure drop.
# Raw values and the applied baseline are recorded per frame; no B key is used.
robot:
  type: bi_seeed_b601_dm_follower
  left_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.2:1.0
  right_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.1:1.0
  id: bi_rebot_b601_dm_flexitac
  can_adapter: damiao
  action_mode: cartesian
  control_mode: pos_vel
  # Order: velocity Kp, velocity Ki, position Kp, position Ki. RAM only; no Flash save.
  left_pos_vel_gains: &switch_pos_vel_gains
    shoulder_pan: [0.0125, 0.004, 150.0, 0.5]
    shoulder_lift: [0.013, 0.004, 200.0, 10.0]
    elbow_flex: [0.013, 0.004, 200.0, 10.0]
    wrist_flex: [0.0032, 0.002, 50.0, 1.0]
    wrist_yaw: [0.0008, 0.004, 50.0, 1.0]
    wrist_roll: [0.0008, 0.002, 50.0, 1.0]
    gripper: [0.0008, 0.002, 50.0, 1.0]
  right_pos_vel_gains: *switch_pos_vel_gains
  control_gripper: true
  enable_observation_joint_pos: true
  left_gripper_type: rebotarm_b601
  right_gripper_type: rebotarm_b601
  rt_rate: 100.0
  # Sensor assignments match the reported left/right and inner/outer installation.
  # Keep all four sensor surfaces free of contact during startup calibration.
  flexitac_left_inner_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0L9KZJ-if00-port0
  flexitac_left_outer_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0LS5C8-if00-port0
  flexitac_right_inner_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0L9AYV-if00-port0
  flexitac_right_outer_port: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AB0LSK5O-if00-port0
  flexitac_auto_zero: true
  flexitac_calibration_mean_min: 0.0
  flexitac_calibration_mean_max: 200.0
  cameras:
    global: {type: opencv, index_or_path: 4, width: 640, height: 480, fps: 30, fourcc: YUYV}
    left_wrist: {type: opencv, index_or_path: 8, width: 640, height: 480, fps: 30, fourcc: MJPG}
    right_wrist: {type: opencv, index_or_path: 6, width: 640, height: 480, fps: 30, fourcc: MJPG}

teleop:
  type: bi_switch_joycon
  id: bi_switch_joycon
  left_device: left
  right_device: right

dataset:
  repo_id: yechen/b601-bi-flexitac-auto-zero
  root: data/egg_auto_zero
  single_task: Dual-arm manipulation demonstration with tactile sensing.
  num_episodes: 20
  fps: 30
  video: true
  vcodec: h264
  push_to_hub: false
  streaming_encoding: true
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1

# One combined OpenCV window: three cameras above, four tactile heatmaps below.
# Rerun is disabled to avoid a second camera-only window.
display_data: false
display_cameras_only: false
opencv_preview: true
play_sounds: false
# First collection creates the dataset. To append later, pass --resume=true.
resume: false
manual_episode_control: true
