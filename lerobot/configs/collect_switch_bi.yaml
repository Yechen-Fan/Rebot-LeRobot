# Dual-arm Switch Joy-Con recording. Arm/controller settings match tele_switch_bi.yaml.
# Keyboard: c=start, s=save, backspace=discard current episode, esc=exit.
robot:
  type: bi_seeed_b601_dm_follower
  left_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.2:1.0
  right_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.1:1.0
  id: bi_rebot_b601_dm
  can_adapter: damiao
  action_mode: cartesian
  control_mode: pos_vel
  # J4 low-speed/holding compensation, verified with bounded A/B/A tests.
  # Order: velocity Kp, velocity Ki, position Kp, position Ki. RAM only; no Flash save.
  left_pos_vel_gains: &switch_pos_vel_gains
    shoulder_pan: [0.0125, 0.004, 150.0, 0.5]
    shoulder_lift: [0.013, 0.004, 200.0, 10.0]
    elbow_flex: [0.013, 0.004, 200.0, 10.0]
    wrist_flex: [0.0032, 0.002, 50.0, 1.0]
    wrist_yaw: [0.0008, 0.004, 50.0, 1.0]
    wrist_roll: [0.0008, 0.002, 50.0, 1.0]
    gripper: [0.0008, 0.002, 50.0, 1.0]
  right_pos_vel_gains: *switch_pos_vel_gains
  control_gripper: true
  left_gripper_type: rebotarm_b601
  right_gripper_type: rebotarm_b601
  enable_observation_joint_pos: true
  rt_rate: 100.0
  cameras:
    global:
      type: opencv
      index_or_path: 4
      width: 640
      height: 480
      fps: 30
      fourcc: YUYV
    left_wrist:
      type: opencv
      index_or_path: 8
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
    right_wrist:
      type: opencv
      index_or_path: 6
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG

teleop:
  type: bi_switch_joycon
  id: bi_switch_joycon
  left_device: left
  right_device: right

dataset:
  repo_id: yechen/bread
  root: data/bread
  # Replace with the specific task performed in these demonstrations.
  single_task: Dual-arm manipulation demonstration.
  num_episodes: 20
  # Also controls the teleoperation update rate during recording.
  fps: 30
  video: true
  vcodec: h264
  streaming_encoding: true
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  push_to_hub: false

display_data: true
display_cameras_only: true
play_sounds: false
resume: false
manual_episode_control: true

