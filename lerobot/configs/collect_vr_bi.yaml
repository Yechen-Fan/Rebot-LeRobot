robot:
  type: bi_seeed_b601_dm_follower
  left_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.4:1.0
  right_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.1:1.0
  id: bi_rebot_b601_dm
  can_adapter: damiao
  action_mode: joint
  control_mode: pos_vel
  control_gripper: true
  enable_observation_joint_pos: true
  left_gripper_type: rebotarm_b601
  right_gripper_type: rebotarm_b601
  cameras:
    global:
      type: opencv
      index_or_path: 4
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
    left_wrist:
      type: opencv
      index_or_path: 8
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
    right_wrist:
      type: opencv
      index_or_path: 6
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG

teleop:
  type: bi_quest3
  id: bi_quest3

dataset:
  repo_id: local/bi_vr_joint
  root: data/bi_vr_joint
  single_task: Dual-arm manipulation demonstration.
  num_episodes: 20
  fps: 30
  video: true
  push_to_hub: false
  private: false
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  vcodec: h264
  streaming_encoding: true

display_data: false
play_sounds: false
resume: false
manual_episode_control: true
display_cameras_only: false
opencv_preview: true
