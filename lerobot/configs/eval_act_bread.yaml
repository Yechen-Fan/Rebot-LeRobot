# ACT EE inference: refresh each frame, ensemble predictions, bound joint references.
# c=start, s=stop, h=return Home, esc=exit; recording is disabled by default.
robot:
  type: bi_seeed_b601_dm_follower
  left_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.2:1.0
  right_port: /dev/serial/by-path/pci-0000:0b:00.3-usb-0:2.1:1.0
  id: bi_rebot_b601_dm
  can_adapter: damiao
  action_mode: cartesian
  control_mode: pos_vel
  left_pos_vel_gains: &id001
    shoulder_pan:
    - 0.0125
    - 0.004
    - 150.0
    - 0.5
    shoulder_lift:
    - 0.013
    - 0.004
    - 200.0
    - 10.0
    elbow_flex:
    - 0.013
    - 0.004
    - 200.0
    - 10.0
    wrist_flex:
    - 0.0032
    - 0.002
    - 50.0
    - 1.0
    wrist_yaw:
    - 0.0008
    - 0.004
    - 50.0
    - 1.0
    wrist_roll:
    - 0.0008
    - 0.002
    - 50.0
    - 1.0
    gripper:
    - 0.0008
    - 0.002
    - 50.0
    - 1.0
  right_pos_vel_gains: *id001
  control_gripper: true
  left_gripper_type: rebotarm_b601
  right_gripper_type: rebotarm_b601
  enable_observation_joint_pos: true
  rt_rate: 100.0
  cameras:
    global:
      type: opencv
      index_or_path: 4
      width: 640
      height: 480
      fps: 30
      fourcc: YUYV
    left_wrist:
      type: opencv
      index_or_path: 8
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
    right_wrist:
      type: opencv
      index_or_path: 6
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
dataset:
  repo_id: yechen/eval_bread_act_020000_smooth
  root: outputs/eval_bread_act_020000_smooth
  single_task: Dual-arm manipulation demonstration.
  num_episodes: 10
  fps: 30
  video: true
  vcodec: h264
  streaming_encoding: true
  num_image_writer_processes: 0
  num_image_writer_threads_per_camera: 4
  video_encoding_batch_size: 1
  push_to_hub: false
policy:
  type: act
  pretrained_path: outputs/act_bread/checkpoints/020000/pretrained_model
  device: cuda
  push_to_hub: false
  n_action_steps: 1
  temporal_ensemble_coeff: 0.01
display_data: true
play_sounds: false
resume: false
manual_episode_control: true
policy_motion:
  max_joint_velocity: 45.0
  max_joint_acceleration: 180.0
  max_gripper_velocity: 180.0
  max_gripper_acceleration: 720.0

# Inference does not save a dataset unless explicitly enabled.
recording_enabled: false
